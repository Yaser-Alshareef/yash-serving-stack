services:
  serving:
    image: yas1er/aidc-serving_cpu_v2
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /models/Qwen2.5-1.5b
      
      MODEL_ID: ${MODEL_ID:-Qwen2.5-1.5B-Instruct}
      API_KEY: ${API_KEY}
      MAX_TOKENS: ${MAX_TOKENS:-256}
      
    volumes:
      # Mapped from your docker run command (using a relative path is best practice)
      - ./model:/models:ro
      - hf-cache:/home/app/.cache/huggingface
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  hf-cache: