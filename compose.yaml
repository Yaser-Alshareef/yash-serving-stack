services:
  serving:
    image: ${IMAGE:-yas1er/aidc-serving:cpuv2} # we changed the image to use version that we need 
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-/models/Qwen2.5-1.5b}
      LOCAL_FILES_ONLY: ${LOCAL_FILES_ONLY:-true}
      MODEL_ID: ${MODEL_ID:-Qwen2.5-1.5B-Instruct}
      API_KEY: ${API_KEY}
      MAX_TOKENS: ${MAX_TOKENS:-256}
    volumes:
      - ./model:/models:ro
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s